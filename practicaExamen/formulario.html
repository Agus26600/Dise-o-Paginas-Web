<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="css/stylex.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <div class="head-form">
                <h2>Formulario de contacto</h2>
            </div>
        </header>
        <main class="principal">
            <div class="preguntas">
                <h3>Datos del usuario</h3>
                <fieldset>
                   
                    <div class="forms">
                        <label for="nombre">Nombres: </label>
                        <input type="text" id="nombre" name="nombre"><br/>
                    </div>
                    <div class="forms">
                        <label for="apellido">Apellidos: </label>
                        <input type="text" id="apellido" name="apellido"><br/>
                    </div>
                    <div class="forms">
                        <label for="edad">Edad: </label>
                        <input type="number" id="edad" name="edad" min="0" /><br/>
                    </div>
                    <div class="forms">
                        <span>Sexo: </span> <br/>
                        <label for="hombre">Hombre</label>
                        <input type="radio" name="sexo" id="hombre" /> <br/>
            
                        <label for="mujer">Mujer</label>
                        <input type="radio" name="sexo" id="mujer" /> <br/>
                    </div>
                </fieldset>
                <h3>Consejos de mejora (modelos)</h3>
                <fieldset>
                    <div class="forms">
                        <label for="archivo">Archivo (modelo):</label>
                        <input type="file" id="archivo" name="archivo"><br/>
                    </div>
                    <div class="forms">
                        <label for="opinion">¿Te gustó la página?</label><br/>
                        <input type="checkbox" id="Si" name="opinion"><label for="si">Si</label><br/>
                        <input type="checkbox" id="No" name="opinion"><label for="no">No</label><br/>
                    </div>
                    <div class="forms">
                        <label for="consejo">Recomendaciones: </label> <br/>
                        <input type="text" id="consejo" name="consejo"><br/>
                    </div>
                </fieldset>
            </div>
        </main>
        <footer class="footer-form">
            <div>
                <a href="Construcc.html">Descargas</a> |
                <a href="Construcc.html">Aplicaciones</a> |
                <a href="Construcc.html">Dispositivos</a>
            </div>
            <div>
                @Fmat
            </div>
        </footer>
    </div>
</body>
</html>
